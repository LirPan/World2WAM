project: World2WAM
suite: libero_spatial
horizon: 10

fastwam:
  root: /DATA/disk0/jianhua/plr/yjh_space_backup_20250602/idea2_workspace/code/FastWAM
  checkpoint: checkpoints/fastwam_release/libero_uncond_2cam224.pt
  dataset_stats: checkpoints/fastwam_release/libero_uncond_2cam224_dataset_stats.json
  task_config: libero_uncond_2cam224_1e-4
  freeze: true
  mixed_precision: bf16
  device: cuda

libero:
  root: /DATA/disk0/jianhua/plr/yjh_space_backup_20250602/idea2_workspace/code/LIBERO_fresh
  dataset_dir: data/libero_mujoco3.3.2/libero_spatial_no_noops_lerobot

cache:
  output_dir: cache/libero_spatial_h10_full_fastwam
  max_samples: 600000

model:
  latent_dim: 48
  text_dim: 512
  action_dim: 7
  forward_head:
    hidden_dim: 1024
    num_layers: 3
  action_adapter:
    adapter_type: flow_dit
    dit_hidden_dim: 256
    dit_depth: 4
    dit_num_heads: 8
    dit_dropout: 0.1

physics:
  phase_label_version: v1
  num_phases: 8
  physics_dim: 128
  router_hidden_dim: 512
  use_state_in_router: true
  use_text_in_router: true
  gripper_close_sign: auto
  phase_confidence_threshold: 0.3
  auto_threshold: true

train:
  use_physics: true
  use_confidence_weight: true
  use_class_balance: false
  batch_size: 128
  lr: 1.0e-4
  epochs: 10
  max_steps: 20000
  val_ratio: 0.05
  num_workers: 8
  log_every: 100
  output_dir: experiments/world2wam_physics_flow_dit_v1_full
  seed: 42

loss:
  use_act: true
  use_fwd: true
  use_inv: true
  use_cycle: true

weights:
  lambda_flow: 1.0
  lambda_future: 1.0
  lambda_inverse: 0.1
  lambda_cycle: 0.1
  lambda_phase: 0.1
  lambda_phy: 0.1
  flow_loss_weight: 1.0

eval:
  flow_sample_steps: 10
