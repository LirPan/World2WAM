policy_action_only_loss: true
use_future_latent_distill: true
train_future_head: true
use_gt_action_for_future_head: true
use_target_future_for_inverse_head: true
enable_inverse: true
enable_cycle: true

lambda_action: 1.0
lambda_fwd: 0.1
lambda_inv: 0.05
lambda_cycle: 0.05
world_loss_scale: 1.0
world_gradient_mode: project_conflicts
gradient_log_every: 100
future_loss_warmup_steps: 500

future_horizon: 1
future_latent_dim: 48
hidden_dim: 1024
action_dim: 7
inverse_hidden_size: 1024
hard_sample_fraction: 0.0
hard_task_keywords: []

batch_size: 2
num_epochs: 20
lr: 1.0e-4
backbone_lr: 5.0e-5
seed: 42
num_workers: 2
device: cuda
mixed_precision: bf16
log_every: 20
save_every: 500
keep_last_checkpoints: 3
max_train_steps: 6000
precompute_max_samples: 12000

