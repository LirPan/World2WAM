checkpoint_path: /DATA/disk0/yjh/libero_work_wj/checkpoints/fastwam_release/libero_uncond_2cam224.pt
dataset_stats_path: /DATA/disk0/yjh/libero_work_wj/checkpoints/fastwam_release/dataset_stats.json

backbone_mode: lora
lora_rank: 8
lora_alpha: 16
